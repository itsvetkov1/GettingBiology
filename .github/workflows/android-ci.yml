name: Android CI

on:
  push:
    branches:
      - 'main'
      - 'master'
      - 'develop'
      - 'release/**'
      - 'feat/**'
      - 'fix/**'
      - 'claude/**'
      - 'test'
  pull_request:
    branches:
      - 'main'
      - 'master'
      - 'develop'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  actions: read

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  # ===========================================
  # Job 1: Parse commit message flags
  # ===========================================
  parse-flags:
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.flags.outputs.run_tests }}
      force_build: ${{ steps.flags.outputs.force_build }}
      ignore_build: ${{ steps.flags.outputs.ignore_build }}
    steps:
      - name: Parse commit message flags
        id: flags
        run: |
          # Get commit message from push or pull request
          if [ "${{ github.event_name }}" == "push" ]; then
            COMMIT_MSG=$(cat << 'EOF'
          ${{ github.event.head_commit.message }}
          EOF
          )
          else
            COMMIT_MSG=$(cat << 'EOF'
          ${{ github.event.pull_request.title }}
          EOF
          )
          fi
          
          COMMIT_MSG_LOWER=$(echo "$COMMIT_MSG" | tr '[:upper:]' '[:lower:]')
          echo "Parsed commit message: $COMMIT_MSG"
          
          # Initialize outputs
          RUN_TESTS="false"
          FORCE_BUILD="false"
          IGNORE_BUILD="false"
          
          # Check for flags
          if [[ "$COMMIT_MSG_LOWER" == *"[test]"* ]]; then
            RUN_TESTS="true"
            echo "✓ [test] flag detected"
          fi
          
          if [[ "$COMMIT_MSG_LOWER" == *"[build]"* ]]; then
            FORCE_BUILD="true"
            echo "✓ [build] flag detected"
          fi
          
          if [[ "$COMMIT_MSG_LOWER" == *"[ignore]"* ]]; then
            IGNORE_BUILD="true"
            echo "✓ [ignore] flag detected"
          fi
          
          # Set outputs
          echo "run_tests=$RUN_TESTS" >> $GITHUB_OUTPUT
          echo "force_build=$FORCE_BUILD" >> $GITHUB_OUTPUT
          echo "ignore_build=$IGNORE_BUILD" >> $GITHUB_OUTPUT

  # ===========================================
  # Job 2: Run Unit Tests (when [test] flag present)
  # ===========================================
  unit-tests:
    needs: parse-flags
    if: needs.parse-flags.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --continue

      - name: Generate test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Test Results
          path: '**/build/test-results/test*/TEST-*.xml'
          reporter: java-junit
          fail-on-error: true

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            **/build/test-results/
            **/build/reports/tests/
          retention-days: 14

  # ===========================================
  # Job 3: Build APK
  # ===========================================
  build-apk:
    needs: parse-flags
    # Build APK if:
    # - [ignore] is NOT present AND
    # - ([build] flag is present OR branch is main/master/release)
    if: |
      needs.parse-flags.outputs.ignore_build != 'true' &&
      (
        needs.parse-flags.outputs.force_build == 'true' ||
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/master' ||
        startsWith(github.ref, 'refs/heads/release/')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          echo "Starting Debug APK build..."
          ./gradlew assembleDebug --stacktrace --info || {
            echo "Debug build failed with exit code $?"
            exit 1
          }
          echo "Debug APK build completed successfully"

      - name: Build Release APK
        run: |
          echo "Starting Release APK build..."
          ./gradlew assembleRelease --stacktrace --info || {
            echo "Release build failed with exit code $?"
            exit 1
          }
          echo "Release APK build completed successfully"

      - name: Rename APKs with build info
        run: |
          echo "Searching for built APK files..."
          find . -name "*.apk" -type f

          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          BRANCH_NAME=$(echo ${{ github.ref_name }} | sed 's/\//-/g')

          mkdir -p artifacts

          # Find and rename debug APK
          DEBUG_APK=$(find . -name "*-debug.apk" -type f | head -1)
          if [ -n "$DEBUG_APK" ]; then
            echo "Found debug APK: $DEBUG_APK"
            cp "$DEBUG_APK" "artifacts/znam-li-${BRANCH_NAME}-${SHORT_SHA}-debug.apk"
            echo "Copied to artifacts/znam-li-${BRANCH_NAME}-${SHORT_SHA}-debug.apk"
          else
            echo "WARNING: No debug APK found!"
          fi

          # Find and rename release APK
          RELEASE_APK=$(find . -name "*-release*.apk" -type f | head -1)
          if [ -n "$RELEASE_APK" ]; then
            echo "Found release APK: $RELEASE_APK"
            cp "$RELEASE_APK" "artifacts/znam-li-${BRANCH_NAME}-${SHORT_SHA}-release.apk"
            echo "Copied to artifacts/znam-li-${BRANCH_NAME}-${SHORT_SHA}-release.apk"
          else
            echo "WARNING: No release APK found!"
          fi

          echo "Contents of artifacts directory:"
          ls -lh artifacts/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        if: hashFiles('artifacts/*.apk') != ''
        with:
          name: apk-${{ github.ref_name }}-${{ github.sha }}
          path: artifacts/*.apk
          retention-days: 30
          if-no-files-found: warn

  # ===========================================
  # Job 4: Build skipped notification
  # ===========================================
  build-skipped:
    needs: parse-flags
    if: needs.parse-flags.outputs.ignore_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Build skipped
        run: |
          echo "⏭️ APK build was skipped due to [ignore] flag in commit message"
          echo "Commit: ${{ github.event.head_commit.message }}"

  # ===========================================
  # Job 5: Summary
  # ===========================================
  summary:
    needs: parse-flags
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate summary
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Flag | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| [test] | ${{ needs.parse-flags.outputs.run_tests }} |" >> $GITHUB_STEP_SUMMARY
          echo "| [build] | ${{ needs.parse-flags.outputs.force_build }} |" >> $GITHUB_STEP_SUMMARY
          echo "| [ignore] | ${{ needs.parse-flags.outputs.ignore_build }} |" >> $GITHUB_STEP_SUMMARY
