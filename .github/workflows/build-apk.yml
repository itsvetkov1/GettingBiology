name: Build APK

on:
  push:
    branches:
      - main
      - master
      - claude/add-apk-build-id-fZtAy  # Testing branch
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK with build number
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            APK_DIR=$(dirname "$APK_PATH")
            mv "$APK_PATH" "$APK_DIR/gb_${BUILD_NUMBER}.apk"
            echo "APK renamed to gb_${BUILD_NUMBER}.apk"
            echo "APK_NAME=gb_${BUILD_NUMBER}.apk" >> $GITHUB_ENV
          else
            echo "Error: APK file not found"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gb_${{ github.run_number }}
          path: app/build/outputs/apk/debug/gb_${{ github.run_number }}.apk
          retention-days: 30

      - name: Display build info
        run: |
          echo "Build number: ${{ github.run_number }}"
          echo "APK filename: gb_${{ github.run_number }}.apk"
          ls -lh app/build/outputs/apk/debug/
