name: Build Android APK

on:
  push:
    branches:
      - 'claude/**'
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    # Skip build for documentation-only commits
    if: |
      !startsWith(github.event.head_commit.message, '[docs]') &&
      !startsWith(github.event.head_commit.message, '[skip ci]')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run Gradle checks
        run: ./gradlew check
        continue-on-error: true

      - name: Run tests
        run: ./gradlew test
        continue-on-error: true

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK with build number
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            mv "$APK_PATH" "app/build/outputs/apk/debug/gb_${BUILD_NUMBER}.apk"
            echo "APK renamed to gb_${BUILD_NUMBER}.apk"
          else
            echo "Error: APK file not found"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gb_${{ github.run_number }}
          path: app/build/outputs/apk/debug/gb_${{ github.run_number }}.apk
          retention-days: 30

      - name: Get APK info
        run: |
          echo "APK built successfully!"
          ls -lh app/build/outputs/apk/debug/
