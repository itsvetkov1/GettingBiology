plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'kotlin-parcelize'
    id 'kotlin-kapt'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def localProperty = { String name, String fallback ->
    localProperties.getProperty(name, fallback)
}

def debugAdMobApplicationId = 'ca-app-pub-3940256099942544~3347511713'
def debugBannerAdUnitId = 'ca-app-pub-3940256099942544/6300978111'
def debugInterstitialAdUnitId = 'ca-app-pub-3940256099942544/1033173712'
def releaseAdMobApplicationId = localProperty('ADMOB_APPLICATION_ID', 'ca-app-pub-3551035007628625~1796855252')
def releaseBannerAdUnitId = localProperty('ADMOB_BANNER_AD_UNIT_ID', 'ca-app-pub-3551035007628625/8032474007')
def releaseInterstitialAdUnitId = localProperty('ADMOB_INTERSTITIAL_AD_UNIT_ID', 'ca-app-pub-3551035007628625/7595976845')

android {
    namespace 'com.znam.app'
    compileSdk 35

    buildFeatures {
        buildConfig true
        compose true
    }

    defaultConfig {
        applicationId "com.znam.app"
        minSdk 28
        targetSdk 35
        versionCode 5
        versionName "5"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            manifestPlaceholders = [ADMOB_APPLICATION_ID: debugAdMobApplicationId]
            buildConfigField 'String', 'ADMOB_BANNER_AD_UNIT_ID', "\"${debugBannerAdUnitId}\""
            buildConfigField 'String', 'ADMOB_INTERSTITIAL_AD_UNIT_ID', "\"${debugInterstitialAdUnitId}\""
        }

        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            manifestPlaceholders = [ADMOB_APPLICATION_ID: releaseAdMobApplicationId]
            buildConfigField 'String', 'ADMOB_BANNER_AD_UNIT_ID', "\"${releaseBannerAdUnitId}\""
            buildConfigField 'String', 'ADMOB_INTERSTITIAL_AD_UNIT_ID', "\"${releaseInterstitialAdUnitId}\""
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ['-Xskip-metadata-version-check']
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

kapt {
    javacOptions {
        option("-J--add-opens=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED")
        option("-J--add-opens=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED")
        option("-J--add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED")
        option("-J--add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED")
        option("-J--add-opens=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED")
        option("-J--add-opens=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED")
        option("-J--add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED")
        option("-J--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED")
        option("-J--add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED")
        option("-J--add-opens=jdk.compiler/com.sun.tools.javac.jvm=ALL-UNNAMED")
    }
}

dependencies {

    implementation 'com.github.bumptech.glide:glide:4.16.0'
    kapt 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.android.gms:play-services-ads:25.2.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'

    implementation platform('androidx.compose:compose-bom:2025.01.00')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.activity:activity-compose:1.10.1'

    implementation 'io.insert-koin:koin-android:4.0.4'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.10.3'
    testImplementation 'org.mockito:mockito-core:5.10.0'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    def room_version = "2.7.2"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"
    // Kotlin users should also include the following
    kapt "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
}