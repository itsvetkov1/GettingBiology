plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'kotlin-parcelize'
    id 'com.google.devtools.ksp'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def localProperty = { String name, String fallback ->
    localProperties.getProperty(name, fallback)
}

def debugAdMobApplicationId = 'ca-app-pub-3940256099942544~3347511713'
def debugBannerAdUnitId = 'ca-app-pub-3940256099942544/6300978111'
def debugInterstitialAdUnitId = 'ca-app-pub-3940256099942544/1033173712'
def releaseAdMobApplicationId = localProperty('ADMOB_APPLICATION_ID', 'ca-app-pub-3551035007628625~1796855252')
def releaseBannerAdUnitId = localProperty('ADMOB_BANNER_AD_UNIT_ID', 'ca-app-pub-3551035007628625/8032474007')
def releaseInterstitialAdUnitId = localProperty('ADMOB_INTERSTITIAL_AD_UNIT_ID', 'ca-app-pub-3551035007628625/7595976845')

android {
    namespace = 'com.znam.app'
    compileSdk = 35

    buildFeatures {
        buildConfig = true
        compose = true
    }

    defaultConfig {
        applicationId "com.znam.app"
        minSdk = 28
        targetSdk = 35
        versionCode = 6
        versionName = "6.0"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

        ksp {
            arg("room.schemaLocation", "$projectDir/schemas")
        }
    }

    buildTypes {
        debug {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            manifestPlaceholders = [ADMOB_APPLICATION_ID: debugAdMobApplicationId]
            buildConfigField 'String', 'ADMOB_BANNER_AD_UNIT_ID', "\"${debugBannerAdUnitId}\""
            buildConfigField 'String', 'ADMOB_INTERSTITIAL_AD_UNIT_ID', "\"${debugInterstitialAdUnitId}\""
        }

        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            manifestPlaceholders = [ADMOB_APPLICATION_ID: releaseAdMobApplicationId]
            buildConfigField 'String', 'ADMOB_BANNER_AD_UNIT_ID', "\"${releaseBannerAdUnitId}\""
            buildConfigField 'String', 'ADMOB_INTERSTITIAL_AD_UNIT_ID', "\"${releaseInterstitialAdUnitId}\""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    sourceSets {
        debug.assets.srcDirs += files("$projectDir/schemas")
    }

    bundle {
        language {
            enableSplit = false
        }
    }
}

dependencies {
    // Core Android
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    // Jetpack Compose (BOM)
    implementation platform('androidx.compose:compose-bom:2025.05.00')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.activity:activity-compose:1.10.1'

    // Lottie for Compose animations
    implementation 'com.airbnb.android:lottie-compose:6.6.4'

    // Konfetti for celebrations
    implementation 'nl.dionsegijn:konfetti-compose:2.0.5'

    // Coil for image loading (Compose-native, replaces Glide)
    implementation 'io.coil-kt:coil-compose:2.7.0'

    // Room (KSP)
    def room_version = "2.7.2"
    implementation "androidx.room:room-runtime:$room_version"
    ksp "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-ktx:$room_version"

    // Koin DI
    implementation 'io.insert-koin:koin-android:4.0.4'

    // AdMob
    implementation 'com.google.android.gms:play-services-ads:25.2.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'org.mockito:mockito-core:5.15.2'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'androidx.test.ext:junit:1.2.1'
    testImplementation "androidx.room:room-testing:$room_version"
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
